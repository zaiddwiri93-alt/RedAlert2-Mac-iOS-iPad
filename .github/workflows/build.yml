name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Make Scripts Executable
      run: chmod +x scripts/*.sh 2>/dev/null || true

    - name: Download Web Assets
      run: ./scripts/download-ra2-web.sh || true

    - name: Generate Xcode Project
      run: xcodegen generate --spec ios/project.yml

    - name: Build Xcode Project
      run: |
        xcodebuild -project ios/RA2.xcodeproj \
                   -scheme RA2 \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO

    - name: Create IPA Package
      run: |
        mkdir -p Payload
        cp -r ios/build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/
        zip -r RedAlert2.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RedAlert2-IPA
        path: RedAlert2.ipa
