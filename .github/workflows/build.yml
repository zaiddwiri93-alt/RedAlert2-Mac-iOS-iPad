name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Find and Build Xcode Project
      run: |
        PROJ_PATH=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
        SCHEME=$(xcodebuild -list -project "$PROJ_PATH" 2>/dev/null | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
        
        echo "Found Project: $PROJ_PATH"
        echo "Found Scheme: $SCHEME"

        if [[ "$PROJ_PATH" == *.xcworkspace ]]; then
          xcodebuild -workspace "$PROJ_PATH" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        else
          xcodebuild -project "$PROJ_PATH" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        fi

    - name: Create IPA Package
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/*.app Payload/
        zip -r RedAlert2.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RedAlert2-IPA
        path: RedAlert2.ipa
