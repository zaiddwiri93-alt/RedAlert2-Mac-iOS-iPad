name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Make Scripts Executable
      run: chmod +x scripts/*.sh

    - name: Run Official Build Script
      run: ./scripts/build-ios.sh --device

    - name: Create IPA Package
      run: |
        mkdir -p Payload
        cp -r ios/build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r ios/build/*.app Payload/ 2>/dev/null || cp -r build/*.app Payload/
        zip -r RedAlert2.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RedAlert2-IPA
        path: RedAlert2.ipa
