name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Tools
      run: brew install xcodegen

    - name: Make Scripts Executable
      run: chmod +x scripts/*.sh

    - name: Download Web Assets and Generate Project
      run: |
        ./scripts/download-ra2-web.sh || true
        cd ios
        xcodegen generate || true

    - name: Build Xcode Project
      run: |
        cd ios
        xcodebuild -project RA2.xcodeproj \
                   -scheme RA2 \
                   -configuration Release \
                   -sdk iphoneos \
                   -derivedDataPath build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO || \
        xcodebuild -project RA2.xcodeproj \
                   -configuration Release \
                   -sdk iphoneos \
                   -derivedDataPath build \
                   CODE_SIGNING_ALLOWED=NO

    - name: Create IPA Package
      run: |
        mkdir -p Payload
        cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r build/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null
        zip -r RedAlert2.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RedAlert2-IPA
        path: RedAlert2.ipa
