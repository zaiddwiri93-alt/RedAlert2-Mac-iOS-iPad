name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build iOS App Dynamic
      run: |
        PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
        echo "Found project file at: $PROJ_FILE"
        
        xcodebuild -project "$PROJ_FILE" \
                   -scheme RA2 \
                   -configuration Release \
                   -sdk iphoneos \
                   -derivedDataPath build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO || \
        xcodebuild -project "$PROJ_FILE" \
                   -configuration Release \
                   -sdk iphoneos \
                   -derivedDataPath build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO

    - name: Create IPA Package
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null
        zip -r RedAlert2.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RedAlert2-IPA
        path: RedAlert2.ipa
