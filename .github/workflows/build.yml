name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies and build web assets
      run: |
        npm install
        npm run build --if-present

    - name: Build iOS Xcode App
      run: |
        cd ios
        xcodebuild clean build \
          -scheme RedAlert2 \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Create IPA Package
      run: |
        mkdir -p Payload
        cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
        zip -r RedAlert2.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RedAlert2-IPA
        path: RedAlert2.ipa
